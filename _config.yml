# GitHub Pages собирает сайт через Jekyll и по умолчанию публикует ВСЕ файлы
# репозитория. Этот файл оставляет на сайте только то, что относится к делу:
# страницу, стили и скрипты.
#
# Исходники остаются в репозитории — они просто не попадают в сборку.

exclude:
  - README.md
  - .assetsignore
  - .gitattributes
  - .gitignore
  - tools/
  - CNAME          # обрабатывается GitHub Pages отдельно, в сборку не нужен
